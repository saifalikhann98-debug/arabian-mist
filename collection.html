<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Collection | Arabian Mist UAE</title>
    <meta name="description" content="Browse the full Arabian Mist UAE collection — oud, amber, saffron, rose and more, composed for the drama of desert evenings." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=7" />
    <link rel="stylesheet" href="/footer.css?v=2" />
  </head>
  <body>
    <div class="notice">Complimentary UAE delivery on orders above AED 150</div>

    <!-- solid (scrolled) header — there is no hero on this page -->
    <header class="site-header is-scrolled" data-header>
      <a class="brand" href="/index.html" aria-label="Arabian Mist UAE home">
        <img class="brand-logo" src="/assets/am-logo.png?v=1" alt="Arabian Mist UAE" />
      </a>

      <nav class="nav-links" aria-label="Primary navigation" data-nav>
        <a href="/index.html">Home</a>
        <a href="/collection" aria-current="page">Collection</a>
        <a href="/index.html#about">About Us</a>
      </nav>

      <div class="header-actions">
        <button class="icon-button" type="button" aria-label="Search fragrances">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="4.5"/>
            <line x1="10" y1="10" x2="14" y2="14"/>
          </svg>
        </button>
        <button class="icon-button" type="button" aria-label="Shopping bag">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M3 5.5h10L11.8 13H4.2L3 5.5z"/>
            <path d="M6 5.5V4a2 2 0 0 1 4 0v1.5"/>
          </svg>
        </button>
        <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" data-menu>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main id="top">
      <section class="collection-section" id="collection" aria-labelledby="collection-heading">
        <div class="collection-header">
          <h2 id="collection-heading">The Collection</h2>
          <span data-collection-count></span>
        </div>
        <div class="product-grid" data-product-grid></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__top">
          <a class="site-footer__logo" href="/index.html" aria-label="Arabian Mist UAE home">
            <img src="/assets/am-logo.png?v=1" alt="Arabian Mist UAE" />
          </a>
          <nav class="site-footer__nav" aria-label="Footer navigation">
            <a href="/collection">Collection</a>
            <a href="/index.html#ritual">Ritual</a>
            <a href="/index.html#atelier">Atelier</a>
            <a class="site-footer__ig" href="https://www.instagram.com/arabianmistperfumes" target="_blank" rel="noopener" aria-label="Arabian Mist on Instagram">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
            </a>
          </nav>
        </div>
        <div class="site-footer__bottom">
          <span>© 2026 Arabian Mist UAE. All rights reserved.</span>
          <span>Crafted in the UAE.</span>
        </div>
      </div>
    </footer>

    <div class="toast" role="status" aria-live="polite" data-toast></div>

    <script src="/data/products.js?v=3"></script>
    <script src="/collection.js?v=1"></script>
  </body>
