<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arabian Mist UAE logo</title>
  <desc id="desc">AM monogram with Arabian Mist UAE wordmark in gold and burgundy.</desc>
  <rect width="640" height="360" rx="0" fill="#0D0D0C"/>
  <defs>
    <linearGradient id="gold" x1="178" y1="54" x2="462" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A5421"/>
      <stop offset="0.38" stop-color="#F4D68A"/>
      <stop offset="0.58" stop-color="#9C7134"/>
      <stop offset="1" stop-color="#F8E3A3"/>
    </linearGradient>
  </defs>
  <text x="320" y="152" text-anchor="middle" fill="url(#gold)" font-family="Cormorant Garamond, Georgia, serif" font-size="118" font-weight="500" letter-spacing="-10">AM</text>
  <text x="320" y="230" text-anchor="middle" fill="#E9C989" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" letter-spacing="22">ARABIAN MIST</text>
  <line x1="218" y1="270" x2="274" y2="270" stroke="#9C7134" stroke-width="2"/>
  <text x="320" y="280" text-anchor="middle" fill="#E9C989" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="12">UAE</text>
  <line x1="366" y1="270" x2="422" y2="270" stroke="#9C7134" stroke-width="2"/>
</svg>
